<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" shape-rendering="crispEdges">
  <!--
    stesso logo di AppLogo: griglia 8×4 unità, ogni pezzo alto 1 unità.
    Il formato è quadrato (8×8), quindi il logo è centrato in verticale:
    il gruppo è spostato di 2 unità verso il basso.
    Sfondo zinc-950 e logo zinc-200, gli stessi colori del sito
  -->
  <rect width="8" height="8" fill="#09090b" />
  <g fill="#e4e4e7" transform="translate(0 2)">
    <rect x="0" y="1" width="2" height="1" />
    <rect x="0" y="2" width="1" height="1" />
    <rect x="0" y="3" width="2" height="1" />

    <rect x="2" y="0" width="4" height="1" />
    <rect x="2" y="2" width="4" height="1" />

    <rect x="6" y="1" width="2" height="1" />
    <rect x="7" y="2" width="1" height="1" />
    <rect x="6" y="3" width="2" height="1" />
  </g>
</svg>
